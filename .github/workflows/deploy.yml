name: Cloud-Build & Deploy to Droplet

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        # `npm ci` (not `npm install`) so the runner builds from the committed
        # lockfile exactly. `npm install` may silently resolve newer versions and
        # rewrite the lock, which would mean the artifact rsynced to the Droplet
        # is not the dependency set that was reviewed and tested.
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        # Gates the deploy. Each test file provisions its own scratch SQLite
        # database in the runner's temp dir, so no DATABASE_URL is needed here
        # and production data is never involved.
        run: npm test

      - name: Build Application
        # Use GITHUB_SHA for internal BUILD_ID consistency; set stable encryption for actions
        run: |
          export BUILD_ID=${{ github.sha }}
          export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.ACTIONS_ENCRYPTION_KEY || 'agendamaster-stable-key-32chars' }}
          npm run build

      - name: Copy Files to Droplet
        # Pinned to a release tag, not @master. This action receives
        # SSH_PRIVATE_KEY; a floating branch ref means whatever is on that
        # branch at deploy time runs with the Droplet's key. Dependabot also
        # cannot propose updates for a branch ref, only for a pinned version.
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".next,public,node_modules,package.json,ecosystem.config.js,prisma"
          target: "/var/www/agendamaster"

      - name: PM2 Reload
        # Pinned for the same reason as the scp step above.
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Load the NVM/Node Environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Navigate and Sync Database
            cd /var/www/agendamaster
            export DATABASE_URL="file:/var/www/data/prod.db"
            npx prisma db push --url="$DATABASE_URL"
            npx tsx prisma/seed.ts
            
            # 3. Reload PM2
            pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
